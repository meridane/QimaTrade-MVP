services:
  qima-security-db:
    image: postgres:17-alpine
    container_name: qima-security-fixture-db
    environment:
      POSTGRES_DB: qima_security_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-fixture-password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qima_security_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./supabase/fixtures/qima_local_test_bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
