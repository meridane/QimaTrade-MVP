name: QIMA temporary Next.js patch lockfile regeneration

on:
  push:
    branches:
      - work/qima-next-15-5-29-lockfile-20261121-2115
    paths:
      - ".github/workflows/qima-next-lockfile-regenerate.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile from the exact patched Next.js version
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact Next.js and SWC lock entries
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const expected = "15.5.29";
          const next = lock.packages["node_modules/next"]?.version;
          const env = lock.packages["node_modules/@next/env"]?.version;
          const swc = Object.entries(lock.packages)
            .filter(([name]) => name.startsWith("node_modules/@next/swc-"))
            .map(([name, value]) => ({ name, version: value.version }));
          if (lock.packages[""]?.dependencies?.next !== expected || next !== expected || env !== expected) {
            throw new Error("Expected package.json/lock Next.js and @next/env to be exactly " + expected);
          }
          if (swc.length === 0 || swc.some((item) => item.version !== expected)) {
            throw new Error("Expected every locked @next/swc package to be exactly " + expected);
          }
          const sharp = lock.packages["node_modules/sharp"]?.version;
          if (!sharp || !/^0\\.35\\./.test(sharp)) {
            throw new Error("Expected the existing sharp 0.35.x line to remain locked; found " + sharp);
          }
          console.log(JSON.stringify({ next, env, swc, sharp }, null, 2));
          NODE
          git diff --exit-code -- package.json
      - name: Install from regenerated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check audit no longer reports Next.js
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          set -e
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log("npm audit counts:", JSON.stringify(counts));
          if (report.vulnerabilities?.next) {
            throw new Error("Next.js remains in npm audit after the 15.5.29 lockfile update");
          }
          if ((counts.high ?? 0) > 0 || (counts.critical ?? 0) > 0) {
            throw new Error("High or critical dependency findings remain");
          }
          NODE
      - name: Upload generated lockfile as a recovery artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: next-15-5-29-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated lockfile to the work branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "ERROR: lockfile regeneration produced no package-lock change." >&2
            exit 1
          fi
          git commit -m "chore(deps): lock Next.js 15.5.29 security patch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
