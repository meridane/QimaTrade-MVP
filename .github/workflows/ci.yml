name: QIMA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Vérification quotidienne à 19 h en Corée (UTC+9).
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qima-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, audit, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund

      - name: Dependency security audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: TypeScript check
        id: typecheck
        run: npm run typecheck

      - name: Production build
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Install Playwright Chromium
        id: browser_install
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        id: e2e
        run: npm run test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Write automation report
        if: always()
        shell: bash
        run: |
          {
            echo "# QIMA — Rapport de vérification automatique"
            echo
            echo "- Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Déclencheur : ${{ github.event_name }}"
            echo "- Branche : ${{ github.ref_name }}"
            echo "- Commit : ${{ github.sha }}"
            echo
            echo "| Contrôle | Résultat |"
            echo "|---|---|"
            echo "| Installation | ${{ steps.install.outcome || 'non exécuté' }} |"
            echo "| Audit dépendances (seuil élevé) | ${{ steps.audit.outcome || 'non exécuté' }} |"
            echo "| TypeScript | ${{ steps.typecheck.outcome || 'non exécuté' }} |"
            echo "| Build production | ${{ steps.build.outcome || 'non exécuté' }} |"
            echo "| Installation navigateur | ${{ steps.browser_install.outcome || 'non exécuté' }} |"
            echo "| Tests navigateur | ${{ steps.e2e.outcome || 'non exécuté' }} |"
            echo
            echo "L'audit npm reste informatif. Toute correction automatique des dépendances doit être revue avant fusion."
          } >> "$GITHUB_STEP_SUMMARY"
