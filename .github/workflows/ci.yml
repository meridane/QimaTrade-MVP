name: QIMA CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qima-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, audit, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install dependencies from committed lockfile
        id: install
        run: npm ci --no-audit --no-fund
      - name: Dependency security audit
        id: audit
        # Defer failure until the report can be uploaded; the enforcement step below remains blocking.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          audit_status=$?
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          const lines = [
            "## npm audit details",
            "",
            "| Severity | Count |",
            "|---|---:|",
            "| Critical | " + (counts.critical ?? 0) + " |",
            "| High | " + (counts.high ?? 0) + " |",
            "| Moderate | " + (counts.moderate ?? 0) + " |",
            "| Low | " + (counts.low ?? 0) + " |",
            "",
            "See the npm-audit-report artifact for the full machine-readable report."
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          console.log(JSON.stringify(counts));
          NODE
          exit "$audit_status"
      - name: TypeScript check
        id: typecheck
        run: npm run typecheck
      - name: Production build
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      - name: Install Playwright Chromium
        id: browser_install
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        id: e2e
        run: npm run test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - name: Enforce dependency audit result
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          if [ "${AUDIT_OUTCOME}" != "success" ]; then
            echo "::error::Dependency audit did not complete successfully. Review the npm-audit-report artifact."
            exit 1
          fi

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload committed lockfile for verification
        if: success() && steps.install.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: committed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Write automation report
        if: always()
        shell: bash
        run: |
          {
            echo "# QIMA — Rapport de vérification automatique"
            echo
            echo "- Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Déclencheur : ${{ github.event_name }}"
            echo "- Branche : ${{ github.ref_name }}"
            echo "- Commit : ${{ github.sha }}"
            echo
            echo "| Contrôle | Résultat |"
            echo "|---|---|"
            echo "| Installation | ${{ steps.install.outcome || 'non exécuté' }} |"
            echo "| Audit dépendances (seuil élevé) | ${{ steps.audit.outcome || 'non exécuté' }} |"
            echo "| TypeScript | ${{ steps.typecheck.outcome || 'non exécuté' }} |"
            echo "| Build production | ${{ steps.build.outcome || 'non exécuté' }} |"
            echo "| Installation navigateur | ${{ steps.browser_install.outcome || 'non exécuté' }} |"
            echo "| Tests navigateur | ${{ steps.e2e.outcome || 'non exécuté' }} |"
            echo
            echo "L'audit npm est bloquant au seuil high : tout résultat non nul de npm audit --audit-level=high fait échouer ce job via l'étape d'application dédiée. Les niveaux sous le seuil sont reportés dans le tableau et l'artefact JSON sans bloquer ce contrôle. Toute correction de dépendance doit être revue avant fusion."
          } >> "$GITHUB_STEP_SUMMARY"


  postgres-integration:
    name: CREATE_OFFER PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qima_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qima_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run isolated CREATE_OFFER integration and concurrency tests
        run: bash tests/sql/run-create-offer-integration.sh

      - name: Verify legacy migration runner rejects unsafe database URLs
        run: bash tests/sql/test-legacy-messages-runner-guard.sh

      - name: Run isolated legacy messages RLS regression tests
        run: bash tests/sql/run-legacy-messages-rls-regression.sh

      - name: Verify disposable migration database was removed from PostgreSQL
        run: bash tests/sql/assert-legacy-migration-database-absent.sh

      - name: Run real SQL failure and verify disposable migration cleanup
        run: bash tests/sql/test-legacy-messages-real-failure-cleanup.sh

      - name: Verify DROP DATABASE WITH FORCE terminates active sessions
        run: bash tests/sql/test-legacy-messages-active-session-cleanup.sh

      - name: Run isolated participant self-enrollment RLS regression tests
        run: bash tests/sql/run-participant-self-enrollment-regression.sh
