name: QIMA 15-minute Autonomous Development Loop

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

concurrency:
  group: qima-autopilot-main
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Inspect previous result and execute one safe task
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Check configuration and pending automation PR
        id: guard
        env:
          GH_TOKEN: \${{ github.token }}
          OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "\${OPENAI_API_KEY:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## QIMA Autopilot: configuration required"
              echo
              echo "The scheduled loop is installed, but the repository secret OPENAI_API_KEY is missing."
              echo "Add it in Settings -> Secrets and variables -> Actions, then run this workflow manually."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pending="$(gh pr list --state open --json number,title,headRefName,url --jq '[.[] | select(.headRefName | startswith("qima-autopilot/"))]')"
          if [ "$pending" != "[]" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## QIMA Autopilot: waiting for review"
              echo
              echo "An automation-created PR is still open. To prevent conflicting changes, no second coding task was started."
              echo
              echo "$pending"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prepare context and dedicated branch
        if: steps.guard.outputs.ready == 'true'
        id: context
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_runs="$(gh run list --workflow qima-autopilot.yml --limit 5 --json databaseId,conclusion,createdAt,url,displayTitle | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const current=Number(process.env.GITHUB_RUN_ID);const runs=JSON.parse(s).filter(r=>r.databaseId!==current);console.log(JSON.stringify(runs,null,2))})')"
          last_run_id="$(printf '%s' "$previous_runs" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0]?.databaseId ?? ""))')"
          last_run_conclusion="$(printf '%s' "$previous_runs" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0]?.conclusion ?? ""))')"
          previous_failure_logs=""
          if [ "$last_run_conclusion" = "failure" ] && [ -n "$last_run_id" ]; then
            previous_failure_logs="$(gh run view "$last_run_id" --log-failed 2>&1 | tail -n 100 || true)"
          fi
          open_prs="$(gh pr list --state open --json number,title,headRefName,url)"
          merged_autopilot_prs="$(gh pr list --state merged --limit 5 --json number,title,headRefName,url,mergedAt,body --jq '[.[] | select(.headRefName | startswith("qima-autopilot/"))]')"
          recent_commits="$(git log -5 --oneline)"
          branch="qima-autopilot/$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          {
            echo "# QIMA AUTOPILOT TASK"
            echo
            echo "You are the autonomous senior engineer for meridane/QimaTrade-MVP."
            echo "This run is one 15-minute iteration in a controlled development loop."
            echo
            echo "## Required reading"
            echo "- Read docs/QIMA_V1_FUNCTION_REGISTER.md first."
            echo "- Read repository instructions such as AGENTS.md if present."
            echo "- Inspect the relevant code and tests before deciding."
            echo
            echo "## Previous automation run results (newest first; current run excluded)"
            echo "$previous_runs"
            echo
            echo "## Failed-step logs from the immediately previous failed run, if any"
            echo "$previous_failure_logs"
            echo
            echo "## Open pull requests (do not duplicate or conflict with these tasks)"
            echo "$open_prs"
            echo
            echo "## Recently merged automation PRs"
            echo "$merged_autopilot_prs"
            echo
            echo "## Recent main commits"
            echo "$recent_commits"
            echo
            echo "## Instructions"
            echo "1. Select exactly ONE highest-priority, safely actionable task from the register, considering prior run results and all open PRs."
            echo "2. Do not duplicate work already in an open PR. Prefer small, testable improvements; add or improve tests for the changed behavior."
            echo "3. Make real code changes, not just a plan. Update the register only when the status change is supported by evidence."
            echo "4. Run npm run typecheck, npm run build, and npm run test:e2e when available. Do not claim a check passed unless you ran it successfully."
            echo "5. Never merge a PR, deploy, access production data, apply Supabase migrations, or change production database state."
            echo "6. Never print, inspect, or copy secrets or environment values. Do not weaken authentication, RLS, permissions, CI, or security checks."
            echo "7. Do not modify .github/workflows/**, .github configuration, supabase/migrations/**, or any .env* file. The workflow will discard any such changes."
            echo "8. If the previous run failed, use that information to avoid repeating the same failure and repair it only if it relates to the selected task."
            echo "9. If no safe, meaningful task can be completed, leave the code unchanged and explain why."
            echo
            echo "At the end, give a concise factual report: task selected, files changed, checks actually run and their results, remaining risks."
          } > .qima-autopilot-prompt.md

      - name: Install project dependencies
        if: steps.guard.outputs.ready == 'true'
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Playwright Chromium
        if: steps.guard.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Codex coding agent
        if: steps.guard.outputs.ready == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: \${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .qima-autopilot-prompt.md
          output-file: /tmp/qima-autopilot-result.md

      - name: Verify typecheck, production build, and browser tests
        if: steps.guard.outputs.ready == 'true'
        id: verify
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        shell: bash
        run: |
          set +e
          npm run typecheck
          typecheck_status=$?
          npm run build
          build_status=$?
          npm run test:e2e
          e2e_status=$?
          {
            echo "typecheck=$typecheck_status" >> "$GITHUB_OUTPUT"
            echo "build=$build_status" >> "$GITHUB_OUTPUT"
            echo "e2e=$e2e_status" >> "$GITHUB_OUTPUT"
          }
          {
            echo "## Automated validation"
            echo
            echo "| Check | Exit code |"
            echo "|---|---:|"
            echo "| TypeScript | $typecheck_status |"
            echo "| Production build | $build_status |"
            echo "| Playwright E2E | $e2e_status |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$typecheck_status" -ne 0 ] || [ "$build_status" -ne 0 ] || [ "$e2e_status" -ne 0 ]; then
            exit 1
          fi

      - name: Validate changes and create reviewed PR
        if: steps.guard.outputs.ready == 'true'
        id: publish
        env:
          GH_TOKEN: \${{ github.token }}
          CODEX_FINAL_MESSAGE: \${{ steps.codex.outputs.final-message }}
          BRANCH: \${{ steps.context.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .qima-autopilot-prompt.md

          # Never allow the agent to change the orchestrator, its permissions, production migrations, or secrets.
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|.github/*|supabase/migrations/*|.env*)
                git checkout -- "$path" 2>/dev/null || rm -f "$path"
                ;;
            esac
          done < <(git status --porcelain | sed -E 's/^...//')

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## QIMA Autopilot: no code change"
              echo
              printf '%s\n' "\${CODEX_FINAL_MESSAGE:-The agent did not produce a final report.}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(autopilot): implement next verified QIMA task"
          git push --set-upstream origin "$BRANCH"

          # GITHUB_TOKEN-triggered PR events may not start other workflows, so dispatch CI on this branch.
          gh workflow run ci.yml --ref "$BRANCH" || echo "CI dispatch could not be started automatically; review the PR checks manually."

          title="$(git log -1 --pretty=%s)"
          {
            echo "## Automated task report"
            echo
            printf '%s\n' "\${CODEX_FINAL_MESSAGE:-No final report was returned by the coding agent.}"
            echo
            echo "### Guardrails"
            echo "- Created on a dedicated branch; not merged automatically."
            echo "- Production Supabase was not modified."
            echo "- Review the diff and CI checks before merging."
            echo
            echo "### Validation"
            echo "- TypeScript exit code: ${TYPECHECK_STATUS:-not run}"
            echo "- Production build exit code: ${BUILD_STATUS:-not run}"
            echo "- Playwright E2E exit code: ${E2E_STATUS:-not run}"
            echo "- CI workflow dispatch requested for branch: $BRANCH."
          } > /tmp/qima-pr-body.md
          if [ "${TYPECHECK_STATUS:-1}" = "0" ] && [ "${BUILD_STATUS:-1}" = "0" ] && [ "${E2E_STATUS:-1}" = "0" ]; then
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file /tmp/qima-pr-body.md
          else
            gh pr create --draft --base main --head "$BRANCH" --title "$title" --body-file /tmp/qima-pr-body.md
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "## QIMA Autopilot: pull request created"
            echo
            echo "Branch: $BRANCH"
            echo
            printf '%s\n' "\${CODEX_FINAL_MESSAGE:-No final report was returned by the coding agent.}"
          } >> "$GITHUB_STEP_SUMMARY"
