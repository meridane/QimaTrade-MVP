name: QIMA temporary Next.js 15.5.29 lockfile refresh

on:
  push:
    branches:
      - work/qima-nextjs-15529-lock-refresh-20261122-2012
    paths:
      - ".github/workflows/qima-nextjs-lockfile-refresh.yml"

permissions:
  contents: write

concurrency:
  group: qima-nextjs-15529-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    name: Refresh lockfile and verify Next.js 15.5.29
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Refresh only the Next.js dependency graph in the lockfile
        run: npm update next --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify resolved framework and image optimizer versions
        shell: bash
        run: |
          node <<'NODE'
          const lock = require("./package-lock.json");
          const next = lock.packages["node_modules/next"];
          const sharp = lock.packages["node_modules/sharp"];
          console.log(JSON.stringify({
            next: next?.version,
            nextEnv: lock.packages["node_modules/@next/env"]?.version,
            sharp: sharp?.version
          }, null, 2));
          if (next?.version !== "15.5.29") {
            throw new Error("Expected Next.js 15.5.29 in package-lock.json");
          }
          if (sharp && !["0.35.5", "0.35.6", "0.35.7", "0.35.8", "0.36.0"].includes(sharp.version)) {
            throw new Error("Unexpected sharp version; inspect its security advisory before proceeding");
          }
          NODE
          git diff --check
          git diff --exit-code -- package.json

      - name: Install exactly from the refreshed lockfile
        run: npm ci --no-audit --no-fund

      - name: Run dependency audit and report advisory counts
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          audit_status=$?
          set -e
          node <<'NODE'
          const report = require("./npm-audit.json");
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log("npm audit counts:", JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via ?? []).map(v => typeof v === "string" ? v : v.title)
            }));
          }
          if ((counts.high ?? 0) > 0 || (counts.critical ?? 0) > 0) {
            process.exit(1);
          }
          NODE
          if [ "$audit_status" -ne 0 ]; then
            echo "npm audit returned $audit_status despite no high/critical findings; inspect the report."
            exit "$audit_status"
          fi

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright regression suite
        run: npm run test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Commit verified lockfile to this temporary work branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No package-lock changes were produced."
          else
            git commit -m "chore(deps): refresh Next.js 15.5.29 lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextjs-15529-npm-audit
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 7
